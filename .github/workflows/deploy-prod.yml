name: Deploy Prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: docker.io/samuelfranklindev/intercurso-ifrn-backend
  TAG: sha-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $IMAGE:$TAG .

      - name: Push Docker image
        run: docker push $IMAGE:$TAG

      - name: Trigger Render Deploy (prod)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: |
          echo "Imagem enviada ao Render: ${IMAGE}:${TAG}"
          status=$(curl -sS -o response.txt -w "%{http_code}" -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${IMAGE//\//%2F}%3A${TAG}")
          echo "Render respondeu HTTP $status"
          cat response.txt; echo
          [ "$status" -lt 300 ]