services:
  postgres:
    image: postgres:17
    container_name: postgres-db-intercurso
    restart: always
    environment:
      POSTGRES_DB: intercurso_db
      POSTGRES_USER: intercurso
      POSTGRES_PASSWORD: intercurso
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intercurso -d intercurso_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intercurso

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: api-intercurso
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./business:/app/business
      - ./core:/app/core
      - ./domain:/app/domain
      - ./messaging:/app/messaging
      - ./persistence:/app/persistence
      - ./scheduling:/app/scheduling
      - ./security:/app/security
      - ./storage:/app/storage
      - ./web:/app/web
    networks:
      - intercurso

  seed:
    build: .
    container_name: seed-intercurso
    profiles:
      - seed
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://intercurso:intercurso@postgres:5433/intercurso_db
      DATABASE_URL_SYNC: postgresql://intercurso:intercurso@postgres:5433/intercurso_db
      SEED_ADMIN_MATRICULA: ${SEED_ADMIN_MATRICULA:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - intercurso
    command: sh -c "uv run alembic upgrade head && uv run python -m seeds.dev_seed"

volumes:
  postgres_data:

networks:
  intercurso:
    name: intercurso