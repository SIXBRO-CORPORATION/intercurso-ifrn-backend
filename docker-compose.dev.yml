services:
  postgres:
    image: postgres:17
    container_name: postgres-db-intercurso
    restart: always
    environment:
      POSTGRES_DB: intercurso_db
      POSTGRES_USER: intercurso
      POSTGRES_PASSWORD: intercurso
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intercurso -d intercurso_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intercurso

  api:
    build: .
    container_name: api-intercurso
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - intercurso

volumes:
  postgres_data:

networks:
  intercurso:
    name: intercurso