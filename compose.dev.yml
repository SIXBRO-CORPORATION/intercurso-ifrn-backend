name: intercurso-dev

x-api-build: &api-build
  context: .
  dockerfile: Dockerfile.dev

x-code-volumes: &code-volumes
  - ./alembic:/app/alembic
  - ./alembic.ini:/app/alembic.ini
  - ./business:/app/business
  - ./core:/app/core
  - ./domain:/app/domain
  - ./persistence:/app/persistence
  - ./scheduling:/app/scheduling
  - ./security:/app/security
  - ./web:/app/web

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: *api-build
    image: intercurso-api:dev
    env_file: .env.dev
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    volumes: *code-volumes
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    image: intercurso-api:dev
    env_file: .env.dev
    ports:
      - "8000:8000"
    volumes: *code-volumes
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data_dev:
